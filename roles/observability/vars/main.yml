---
observability_alloy_package: alloy
observability_alloy_repo_name: grafana
observability_alloy_repo_baseurl: https://rpm.grafana.com
observability_alloy_repo_gpgkey: https://rpm.grafana.com/gpg.key
observability_config_dir: /etc/grayhaven/observability
observability_alloy_token_file: "{{ observability_config_dir }}/grafana-alloy-token"
observability_alert_sync_config_file: "{{ observability_config_dir }}/grafana-alert-sync.json"
observability_alert_uid_registry_file: "{{ observability_config_dir }}/grafana-alert-rule-uids.json"
observability_alert_initial_silence_marker_file: "{{ observability_config_dir }}/initial-alert-silence-created"
observability_irm_alert_groups_config_file: "{{ observability_config_dir }}/irm-alert-groups.json"
observability_textfile_config_file: "{{ observability_config_dir }}/textfile-metrics.json"
observability_textfile_dir: /var/lib/grayhaven/observability/textfile
observability_gcs_operation_cache_file: "{{ observability_textfile_dir }}/gcs-operation-counts.json"
observability_google_monitoring_usage_cache_file: "{{ observability_textfile_dir }}/google-monitoring-usage.json"
observability_alloy_http_url: http://127.0.0.1:12345
observability_alloy_ready_retries: 30
observability_alloy_ready_delay: 2
observability_alloy_remote_write_retries: 60
observability_alloy_remote_write_delay: 5
observability_alert_initial_silence_minutes: "{{ observability.alerting.initial_silence_minutes }}"
observability_public_status_services: >-
  {{ {'openai': observability.external_services.openai, 'digitalocean': observability.external_services.digitalocean}
  }}
observability_cpu_warning_percent: "{{ observability.alerting.thresholds.cpu_percent }}"
observability_memory_warning_percent: "{{ observability.alerting.thresholds.memory_percent }}"
observability_filesystem_warning_percent: "{{ observability.alerting.thresholds.filesystem_percent }}"
observability_filesystem_inode_warning_percent: "{{ observability.alerting.thresholds.filesystem_inode_percent\
  \ }}"
observability_swap_warning_percent: "{{ observability.alerting.thresholds.swap_percent }}"
observability_certificate_expiring_seconds: 1209600
observability_restic_stale_seconds: 100800
observability_gcs_stale_bucket_check_stale_seconds: 100800
observability_gcs_operation_refresh_seconds: "{{ observability.collectors.gcs_operations.refresh_seconds }}"
observability_gcs_operation_stale_seconds: 10800
observability_google_monitoring_usage_refresh_seconds: 3600
observability_google_monitoring_usage_stale_seconds: 10800
observability_google_monitoring_monthly_warning_series: >-
  {{ observability.collectors.google_monitoring_usage.monthly_warning_series }}
observability_gcs_class_a_monthly_warning_operations: >-
  {{ observability.collectors.gcs_operations.monthly_warning_operations.class_a }}
observability_gcs_class_b_monthly_warning_operations: >-
  {{ observability.collectors.gcs_operations.monthly_warning_operations.class_b }}
observability_service_units_common: "{{ observability.service_units.common }}"
observability_service_units_web: "{{ observability.service_units.web }}"
observability_service_units_mcp: "{{ observability.service_units.mcp }}"
observability_service_units_control_node: "{{ observability.service_units.control_node }}"
observability_gcs_check_schedule: "{{ observability.collectors.gcs_bucket_check.schedule }}"
observability_display_timezone: "{{ timezone }}"
observability_proton_services: "{{ observability.external_services.proton.services }}"
observability_gcs_status_product: "{{ observability.external_services.google_cloud.storage }}"
observability_google_monitoring_status_product: "{{ observability.external_services.google_cloud.monitoring\
  \ }}"
