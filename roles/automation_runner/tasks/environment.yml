---
- name: Store bastion runner environment
  ansible.builtin.copy:
    dest: /etc/grayhaven/ansible/runner.env
    owner: root
    group: ansible
    mode: "0640"
    content: |
      REPO_URL={{ infrastructure.repositories.config | quote }}
      REPO_REF={{ grayhaven_config_repo_ref | quote }}
      CHECKOUT_DIR={{ grayhaven_config_checkout_dir | quote }}
      VAULT_REPO_URL={{ infrastructure.repositories.vault | quote }}
      VAULT_REPO_REF={{ ('main' if grayhaven_environment == 'prod' else 'staging') | quote }}
      VAULT_CHECKOUT_DIR={{ grayhaven_vault_checkout_dir | quote }}
      GRAYHAVEN_ENVIRONMENT={{ grayhaven_environment | quote }}
      GRAYHAVEN_HOSTNAME={{ automation_runner_effective_hostname | quote }}
      GRAYHAVEN_IS_CONTROL_NODE={{ automation_runner_effective_control_node_string | quote }}
      GRAYHAVEN_CERTIFICATE_ENVIRONMENT={{ certificate.environment | quote }}
      GRAYHAVEN_TLS_MODE={{ grayhaven_tls_mode | quote }}
      MANAGED_BASELINE_TIMEZONE={{ timezone | quote }}
  when: grayhaven_role == "bastion"
  vars:
    automation_runner_effective_hostname: >-
      {{ grayhaven_hostname if grayhaven_hostname is defined else inventory_hostname }}
    automation_runner_effective_is_control_node: >-
      {{
        grayhaven_is_control_node
        if grayhaven_is_control_node is defined
        else 'control-node' in do_tags
      }}
    automation_runner_effective_control_node_string: >-
      {{ 'true' if automation_runner_effective_is_control_node else 'false' }}
