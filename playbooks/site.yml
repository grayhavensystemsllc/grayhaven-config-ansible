---
- name: Apply Grayhaven Systems LLC base configuration
  hosts: all
  become: true
  gather_facts: false
  any_errors_fatal: true

  pre_tasks:
    - name: Load infrastructure identity
      ansible.builtin.include_vars:
        file: "{{ baseline_validation_vault_checkout_dir }}/infrastructure.yml"
        name: infrastructure
      no_log: true

    - name: Load operational configuration
      ansible.builtin.include_vars:
        file: "{{ baseline_validation_vault_checkout_dir }}/operations.yml"
      no_log: true

    - name: Prepare managed inventory metadata before connecting
      ansible.builtin.include_role:
        name: managed_inventory

    - name: Prepare controller hostname mappings before connecting  # noqa: run-once[task]
      ansible.builtin.template:
        src: "{{ playbook_dir | dirname }}/roles/host_identity/templates/hosts.j2"
        dest: /etc/hosts
        owner: root
        group: root
        mode: "0644"
      delegate_to: localhost
      run_once: true
      vars:
        grayhaven_role: bastion
        host_identity_local_inventory_name: "{{ lookup('env', 'GRAYHAVEN_HOSTNAME') }}"

    - name: Wait for managed hosts to accept Ansible connections
      ansible.builtin.wait_for_connection:
        delay: 5
        sleep: 10
        timeout: 300

    - name: Gather facts after managed hosts are reachable
      ansible.builtin.setup:

    - name: Build Discord notification target order  # noqa: run-once[task]
      ansible.builtin.set_fact:
        automation_notifications_targets: >-
          {{
            (
              groups.get('tag_role_bastion', [])
              | intersect(ansible_play_hosts_all)
              | sort
            )
            + (
              groups.get('tag_role_web', [])
              | intersect(ansible_play_hosts_all)
              | sort
            )
            + (
              ansible_play_hosts_all
              | difference(
                  groups.get('tag_role_bastion', [])
                  + groups.get('tag_role_web', [])
                )
              | sort
            )
          }}
      run_once: true

    - name: Notify Discord that configuration started  # noqa: run-once[task]
      ansible.builtin.include_role:
        name: automation_notifications
      vars:
        automation_notifications_target: "{{ automation_notifications_targets | join('\n') }}"
        automation_notifications_title: Ansible Configuration Started
        automation_notifications_color: "{{ automation_notifications_colors.info }}"
      run_once: true

  roles:
    - baseline_validation
    - swap
    - system_packages
    - automation_user
    - restic_backup
    - host_identity
    - sshd_hardening
    - journald
    - dns_resolver
    - time_sync
    - firewalld_policy
    - fail2ban_policy
    - digitalocean_agent
    - automation_runner
    - reboot_notifications
    - admin_access
    - branding
    - deploy_websites
    - timetracker
    - mcp
    - observability

  post_tasks:
    - name: Refresh reboot status after convergence
      ansible.builtin.include_role:
        name: host_status
        tasks_from: reboot-status

    - name: Refresh message of the day after convergence
      ansible.builtin.include_role:
        name: host_status
        tasks_from: motd

    - name: Check for active AlmaLinux bootstrap user processes
      ansible.builtin.command:
        cmd: pgrep -u almalinux
      register: grayhaven_almalinux_processes
      changed_when: false
      failed_when: false

    - name: Remove bootstrap AlmaLinux user after successful convergence
      ansible.builtin.user:
        name: almalinux
        state: absent
        remove: true
      when: grayhaven_almalinux_processes.rc != 0

    - name: Build Discord successful host target order  # noqa: run-once[task]
      ansible.builtin.set_fact:
        automation_notifications_success_targets: >-
          {{
            (
              groups.get('tag_role_bastion', [])
              | intersect(ansible_play_hosts)
              | sort
            )
            + (
              groups.get('tag_role_web', [])
              | intersect(ansible_play_hosts)
              | sort
            )
            + (
              ansible_play_hosts
              | difference(
                  groups.get('tag_role_bastion', [])
                  + groups.get('tag_role_web', [])
                )
              | sort
            )
          }}
      run_once: true

    - name: Record hosts requiring reboot after successful convergence  # noqa: run-once[task]
      ansible.builtin.set_fact:
        automation_notifications_reboot_targets: >-
          {{
            automation_notifications_success_targets
            | zip(
                automation_notifications_success_targets
                | map('extract', hostvars, 'host_status_reboot_required')
              )
            | selectattr('1', 'defined')
            | selectattr('1', 'equalto', true)
            | map('first')
            | list
          }}
      run_once: true

    - name: Record hosts not requiring reboot after successful convergence  # noqa: run-once[task]
      ansible.builtin.set_fact:
        automation_notifications_completed_targets: >-
          {{
            automation_notifications_success_targets
            | reject('in', automation_notifications_reboot_targets)
            | list
          }}
      run_once: true

    - name: Notify Discord that configuration completed  # noqa: run-once[task]
      ansible.builtin.include_role:
        name: automation_notifications
      vars:
        automation_notifications_target: "{{ automation_notifications_completed_targets | join('\n') }}"
        automation_notifications_title: Ansible Configuration Completed
        automation_notifications_color: "{{ automation_notifications_colors.success }}"
      when: automation_notifications_completed_targets | length > 0
      run_once: true

    - name: Notify Discord that configuration completed with reboot required  # noqa: run-once[task]
      ansible.builtin.include_role:
        name: automation_notifications
      vars:
        automation_notifications_target: "{{ automation_notifications_reboot_targets | join('\n') }}"
        automation_notifications_title: Ansible Configuration Completed - Reboot Required
        automation_notifications_color: "{{ automation_notifications_colors.warning }}"
      when: automation_notifications_reboot_targets | length > 0
      run_once: true
