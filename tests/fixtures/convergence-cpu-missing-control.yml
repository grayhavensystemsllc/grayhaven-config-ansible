---
rule_files:
  - generated-cpu.rules.yml
evaluation_interval: 1m

tests:
  # CPU evaluates and the metric alert fires when no control host is
  # configured, or when one of two configured control hosts is missing.
  - interval: 1m
    input_series:
      - series: >-
          node_cpu_seconds_total{host="worker.example.invalid",environment="test",role="worker",
          project="example",client="example",mode="idle"}
        values: '0+6x15'
      - series: >-
          node_systemd_unit_state{host="control.example.invalid",
          name="mock-dependency.service",state="active"}
        values: '0+0x15'
      - series: >-
          node_systemd_unit_state{host="control.example.invalid",
          name="mock-dependency.service",state="activating"}
        values: '1+0x15'
    alert_rule_test:
      - eval_time: 5m
        alertname: CPU
        exp_alerts: []
      - eval_time: 6m
        alertname: CPU
        exp_alerts:
          - exp_labels:
              client: example
              environment: test
              host: worker.example.invalid
              project: example
              role: worker
      - eval_time: 5m
        alertname: DependencyMissing
        exp_alerts:
          - exp_labels: {}
