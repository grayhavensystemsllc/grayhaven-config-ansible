---
rule_files:
  - generated-cpu.rules.yml
evaluation_interval: 1m

tests:
  # CPU evaluates and the metric alert fires when no control host is
  # configured, or when one of two configured control hosts is missing.
  - interval: 1m
    input_series:
      - series: >-
          node_cpu_seconds_total{host="web.example.invalid",environment="test",role="web",
          project="example",client="example",mode="idle"}
        values: '0+6x15'
      - series: >-
          node_systemd_unit_state{host="control.example.invalid",
          name="grayhaven-ansible-runner.service",state="active"}
        values: '0+0x15'
      - series: >-
          node_systemd_unit_state{host="control.example.invalid",
          name="grayhaven-ansible-runner.service",state="activating"}
        values: '1+0x15'
    alert_rule_test:
      - eval_time: 5m
        alertname: CPU
        exp_alerts: []
      - eval_time: 6m
        alertname: CPU
        exp_alerts:
          - exp_labels:
              client: example
              environment: test
              host: web.example.invalid
              project: example
              role: web
      - eval_time: 5m
        alertname: RunnerMetricMissing
        exp_alerts:
          - exp_labels: {}
