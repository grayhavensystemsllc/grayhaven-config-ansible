name: Unit Tests

"on":
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes --requirement pip3_requirements.txt
          python -m pip install --requirement requirements-dev.txt

      - name: Install Prometheus rule test tool
        run: |
          release_url="https://github.com/prometheus/prometheus/releases/download/v3.15.1"
          curl --fail --location --silent --show-error --retry 3 \
            --output "$RUNNER_TEMP/prometheus.tar.gz" \
            "$release_url/prometheus-3.15.1.linux-amd64.tar.gz"
          checksum='6a726885328ad9efebbf36e876ce2fb6225468a71fd1e7ce3ba666d5f4d97a84'
          echo "$checksum  $RUNNER_TEMP/prometheus.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/prometheus.tar.gz" --strip-components=1 \
            -C "$RUNNER_TEMP" prometheus-3.15.1.linux-amd64/promtool
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Run Ruff
        run: python -m ruff check files roles scripts tests plugins

      - name: Run unit tests
        run: |
          python -m coverage run -m unittest discover -s tests -v
          python -m coverage report
          python -m coverage xml
          test -s shell-coverage.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          disable_search: true
          fail_ci_if_error: true
          files: ./coverage.xml,./shell-coverage.xml
          flags: unittests
          use_oidc: true
